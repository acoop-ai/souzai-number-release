<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw='; connect-src 'self' https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>商品呼出番号表</title>
  <meta name="application-name" content="商品呼出番号表">
  <script src="oauth-return.js?v=0.2.1"></script>
  <link rel="stylesheet" href="styles.css?v=0.2.1">
  <script src="config.js?v=0.2.1" defer></script>
  <script src="login.js?v=0.2.1" defer></script>
  <script src="search-norm.js?v=0.2.1" defer></script>
  <script src="core.js?v=0.2.1" defer></script>
  <script src="sheet-model.js?v=0.2.1" defer></script>
  <script src="xlsx-write.js?v=0.2.1" defer></script>
  <script src="app.js?v=0.2.1" defer></script>
  <script src="view-list.js?v=0.2.1" defer></script>
  <script src="view-reader.js?v=0.2.1" defer></script>
  <script src="view-sheet.js?v=0.2.1" defer></script>
  <script src="view-more.js?v=0.2.1" defer></script>
  <script src="import-merge.js?v=0.2.1" defer></script>
  <script src="import-summary.js?v=0.2.1" defer></script>
  <script src="view-month.js?v=0.2.1" defer></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="tb-left">
      <a class="brand" href="#main" id="brand"><strong>商品呼出番号表</strong></a>
      <div class="month-nav" id="month-nav" role="group" aria-label="月を選ぶ" hidden>
        <button id="month-prev" class="btn-icon" type="button" aria-label="前の月へ">◀</button>
        <strong id="month-label">—</strong>
        <button id="month-next" class="btn-icon" type="button" aria-label="次の月へ">▶</button>
        <button id="month-add" class="btn btn-quiet btn-small" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="month-panel" hidden>＋ 月を足す</button>
        <button id="month-publish" class="btn btn-small pub-toggle" type="button" aria-pressed="false" title="店のアカウントに、この月を見せるかどうか" hidden>店に非公開</button>
      </div>
      <nav class="view-tabs" id="view-tabs" role="tablist" aria-label="画面の切り替え" hidden>
        <button type="button" role="tab" data-view="list" aria-selected="true" class="is-active">一覧</button>
        <button type="button" role="tab" data-view="sheet" aria-selected="false">番号表</button>
        <button type="button" role="tab" data-view="log" aria-selected="false">記録</button>
        <button type="button" role="tab" data-view="settings" aria-selected="false" hidden>設定</button>
      </nav>
    </div>
    <div class="tb-right" id="tb-right" hidden>
      <button id="alert-chip" class="alert-chip" type="button" title="アラートのある行だけを一覧に出します">アラート <b id="alert-count">0</b></button>
      <span id="save-state" class="save-state" role="status" aria-live="polite">✓ 自動保存</span>
      <button id="excel-button" class="btn" type="button">Excel</button>
      <a class="btn" href="guide.html" id="guide-link">ガイド</a>
      <div class="menu-wrap">
        <button id="account-button" class="btn btn-quiet" type="button" aria-haspopup="true" aria-expanded="false" aria-label="アカウント"><span id="account-label">未ログイン</span> ▾</button>
        <div id="account-menu" class="pop-menu pop-right" hidden>
          <p id="account-role" class="pop-note"></p>
          <div id="dev-switch" class="dev-switch" hidden>
            <p class="pop-note"><strong>見本のアカウントに切り替える</strong></p>
            <div id="dev-switch-list"></div>
            <button id="dev-reset" type="button"><strong>見本をはじめの形に戻す</strong><small>手元の偽の窓口のデータを 10 月の形へ</small></button>
          </div>
          <button id="signout-button" type="button"><strong>ログアウト</strong></button>
          <p class="pop-note" id="app-version"></p>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="main">
    <section id="notice" class="notice" role="status" aria-live="polite" hidden><span class="notice-mark" aria-hidden="true">!</span><div><strong></strong><p></p></div></section>

    <section id="login-panel" class="login-panel" aria-labelledby="login-title">
      <h1 id="login-title">会社のアカウントでログイン</h1>
      <p>会社のアカウントで入れます。店のアカウントは見るだけです。「Googleでログイン」を押すと、Google の画面へ移ってから、この画面に戻ります。</p>
      <div id="inapp-warning" class="inapp-warning" role="alert" hidden></div>
      <button id="login-button" class="btn btn-primary btn-login" type="button" disabled>ログインの準備中</button>
      <p id="login-help" class="login-help" aria-live="polite">接続先を確かめています。</p>
      <div id="dev-accounts" class="dev-accounts" hidden>
        <p class="dev-title">手元の確かめ用（偽の窓口）: 見本のアカウントで入る</p>
        <div id="dev-account-list"></div>
      </div>
    </section>

    <section id="month-panel" class="month-panel" role="dialog" aria-labelledby="month-panel-title" hidden></section>
    <section id="seed-panel" class="seed-panel view-scroll" aria-labelledby="seed-title" hidden></section>
    <section id="view-list" class="view" aria-label="一覧" hidden></section>
    <section id="view-sheet" class="view" aria-label="番号表の見本" hidden></section>
    <section id="view-log" class="view view-scroll" aria-label="記録" hidden></section>
    <section id="view-settings" class="view view-scroll" aria-label="設定" hidden></section>
  </main>

  <div id="progress" class="progress" role="status" aria-live="polite" hidden><div><i aria-hidden="true"></i><span>読み込んでいます…</span></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="form-menu" class="pop-menu form-menu" role="menu" hidden></div>
  <div id="tray-menu" class="pop-menu tray-menu" hidden></div>
  <div id="drag-ghost" class="drag-ghost" aria-hidden="true" hidden></div>
</body>
</html>
